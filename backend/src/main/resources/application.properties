# ==============================================================================
# EventEasy SaaS Backend Configuration - Master Application Properties
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Spring Application & Server Controls
# ------------------------------------------------------------------------------
spring.application.name=event-management-backend
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# ------------------------------------------------------------------------------
# 2. MySQL Database Connection Pool Configuration
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/event_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.pool-name=EventEasy-HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ------------------------------------------------------------------------------
# 3. JPA & Hibernate ORM Configuration
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ------------------------------------------------------------------------------
# 4. Jackson JSON Serialization & Servlet Upload Limits
# ------------------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ------------------------------------------------------------------------------
# 5. Security, Admin Initializer & JWT Token Parameters
# ------------------------------------------------------------------------------
app.name=EventEasy
app.company=EventEasy SaaS Enterprise
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.token-prefix=Bearer
app.jwt.header-string=Authorization

app.init.admin.email=${INITIAL_ADMIN_EMAIL:admin@eventeasy.com}
app.init.admin.password=${INITIAL_ADMIN_PASSWORD:Admin@12345}
app.init.admin.first-name=${INITIAL_ADMIN_FIRST_NAME:System}
app.init.admin.last-name=${INITIAL_ADMIN_LAST_NAME:Administrator}

# ------------------------------------------------------------------------------
# 6. Google Gemini AI API Configuration
# ------------------------------------------------------------------------------
gemini.api.key=${GEMINI_API_KEY:mock-key}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
gemini.api.model=gemini-1.5-flash

# ------------------------------------------------------------------------------
# 7. OpenAPI (Swagger UI) API Documentation
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ------------------------------------------------------------------------------
# 8. Application Logging & Local Secrets Import (Ignored by Git)
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.eventeasy=DEBUG

# Spring Boot automatically imports application-local.properties if present on your PC
spring.config.import=optional:classpath:application-local.properties
