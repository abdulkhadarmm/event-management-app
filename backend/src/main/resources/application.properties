# ==============================================================================
# EventEasy SaaS Backend Configuration - Shared Base Application Properties
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Spring Application Settings
# ------------------------------------------------------------------------------
spring.application.name=event-management-backend
spring.profiles.active=dev

# ------------------------------------------------------------------------------
# 2. Server Port Configuration
# ------------------------------------------------------------------------------
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# ------------------------------------------------------------------------------
# 3. Jackson JSON Serialization & Formatting Rules
# ------------------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ------------------------------------------------------------------------------
# 4. Servlet Multipart Request Size Limits
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ------------------------------------------------------------------------------
# 5. EventEasy Security & JWT Token Parameters
# ------------------------------------------------------------------------------
app.name=EventEasy
app.company=EventEasy SaaS Enterprise
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.token-prefix=Bearer
app.jwt.header-string=Authorization

# ------------------------------------------------------------------------------
# 6. OpenAPI (Swagger UI) API Documentation
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ------------------------------------------------------------------------------
# 7. Default Application Logging Levels
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.eventeasy=DEBUG
