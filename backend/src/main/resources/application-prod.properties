# ==============================================================================
# EventEasy SaaS Backend Configuration - Production Profile (MySQL)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Externalized Production MySQL DataSource Settings
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# 2. Production HikariCP Connection Pool
# ------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=EventEasy-HikariCP-Prod

# ------------------------------------------------------------------------------
# 3. Hibernate ORM Validation Mode for Production
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ------------------------------------------------------------------------------
# 4. Production Logging Controls
# ------------------------------------------------------------------------------
logging.level.root=WARN
logging.level.com.eventeasy=INFO
logging.level.org.springframework.security=WARN

# ------------------------------------------------------------------------------
# 5. Externalized Admin Initializer Environment Values
# ------------------------------------------------------------------------------
app.init.admin.email=${INITIAL_ADMIN_EMAIL:admin@eventeasy.com}
app.init.admin.password=${INITIAL_ADMIN_PASSWORD:Admin@12345}
app.init.admin.first-name=${INITIAL_ADMIN_FIRST_NAME:System}
app.init.admin.last-name=${INITIAL_ADMIN_LAST_NAME:Administrator}

# ------------------------------------------------------------------------------
# 6. Production Google Gemini AI Configuration
# ------------------------------------------------------------------------------
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
gemini.api.model=gemini-1.5-flash
