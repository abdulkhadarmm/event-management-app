# ==============================================================================
# EventEasy SaaS Backend Configuration - Production Profile (MySQL)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Externalized Production MySQL DataSource Settings
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# 2. Production HikariCP Connection Pool
# ------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=EventEasy-HikariCP-Prod

# ------------------------------------------------------------------------------
# 3. Hibernate ORM Validation Mode for Production
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ------------------------------------------------------------------------------
# 4. Production Logging Controls
# ------------------------------------------------------------------------------
logging.level.root=WARN
logging.level.com.eventeasy=INFO
logging.level.org.springframework.security=WARN

# ------------------------------------------------------------------------------
# 5. Externalized Admin Initializer Environment Values
# ------------------------------------------------------------------------------
app.init.admin.email=${INITIAL_ADMIN_EMAIL}
app.init.admin.password=${INITIAL_ADMIN_PASSWORD}
app.init.admin.first-name=System
app.init.admin.last-name=Admin
