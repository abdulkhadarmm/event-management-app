# ------------------------------------------------------------------------------
# EventEasy Application & Database Development Configuration
# ------------------------------------------------------------------------------

server.port=8080
spring.application.name=event-management-backend

# ------------------------------------------------------------------------------
# 1. MySQL Local Database Connection Pool Configuration
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/event_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.pool-name=EventEasy-HikariCP-Dev
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ------------------------------------------------------------------------------
# 2. JPA & Hibernate ORM Configuration
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ------------------------------------------------------------------------------
# 3. Initial System Administrator Seed Configuration (Environment Injected)
# ------------------------------------------------------------------------------
app.init.admin.email=${INITIAL_ADMIN_EMAIL:admin@eventeasy.com}
app.init.admin.password=${INITIAL_ADMIN_PASSWORD:Admin@12345}
app.init.admin.first-name=${INITIAL_ADMIN_FIRST_NAME:System}
app.init.admin.last-name=${INITIAL_ADMIN_LAST_NAME:Administrator}

# ------------------------------------------------------------------------------
# 4. Google Gemini AI API Configuration
# ------------------------------------------------------------------------------
gemini.api.key=${GEMINI_API_KEY:your-gemini-api-key-here}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
gemini.api.model=gemini-1.5-flash

# ------------------------------------------------------------------------------
# 5. Local Developer Secrets & Overrides Import (Ignored by Git)
# ------------------------------------------------------------------------------
# Spring Boot automatically loads application-local.properties if present on your PC
spring.config.import=optional:classpath:application-local.properties
